<!DOCTYPE html>
<html>
<head>
    <title>Iris Flower Prediction</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 25px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Iris Flower Prediction</h1>

    <p>Decision Tree Classifier</p>

    <form action="/predict" method="POST">

        <input
            type="number"
            step="0.1"
            name="sepal_length"
            placeholder="Sepal Length"
            required
        >

        <input
            type="number"
            step="0.1"
            name="sepal_width"
            placeholder="Sepal Width"
            required
        >

        <input
            type="number"
            step="0.1"
            name="petal_length"
            placeholder="Petal Length"
            required
        >

        <input
            type="number"
            step="0.1"
            name="petal_width"
            placeholder="Petal Width"
            required
        >

        <br>

        <button type="submit">
            Predict
        </button>

    </form>

    {% if prediction %}
        <div class="result">
            Predicted Species: {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
